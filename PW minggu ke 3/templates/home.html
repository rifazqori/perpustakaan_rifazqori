<!doctype html>
<html lang="en">

<head>

    <!-- Mengatur encoding karakter dan ukuran halaman pada layar perangkat. -->
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Memuat Bootstrap untuk gaya tabel dan tata letak halaman. -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Judul yang terlihat pada tab browser. -->
    <title>Koneksi Flask dan PostgreSQL</title>

</head>

<body>

    <!-- Membatasi lebar dan memberi jarak pada isi halaman. -->
    <div class="container">

        <!-- Menjelaskan bahwa tabel di bawah menampilkan data PostgreSQL. -->
        <h1>Koneksi Flask dan PostgreSQL</h1>

        <!-- Memberi jarak sebelum tabel. -->
        <div class="mb-3"></div>

        <!-- Tabel untuk menampilkan data dari variabel users. -->
        <table class="table table-striped">

            <!-- Nama kolom yang ditampilkan kepada pengguna. -->
            <thead>
                <tr>

                    <th scope="col">ID</th>
                    <th scope="col">Username</th>
                    <th scope="col">Password</th>
                    <th scope="col">Email</th>

                </tr>
            </thead>

            <!-- Baris tabel dibuat satu kali untuk setiap data admin. -->
            <tbody>

                <!-- Flask mengirim users dari query; row berisi satu baris hasil query. -->
                {% for row in users %}

                <tr>

                    <!-- Posisi 0 pada hasil query berisi ID. -->
                    <th scope="row">{{ row.0 }}</th>

                    <!-- Posisi 1 berisi username. -->
                    <td>{{ row.1 }}</td>

                    <!-- Posisi 2 berisi password; jangan gunakan password asli karena ditampilkan. -->
                    <td>{{ row.2 }}</td>

                    <!-- Posisi 3 berisi alamat email. -->
                    <td>{{ row.3 }}</td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

    <!-- Memuat JavaScript Bootstrap untuk komponen interaktif. -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
