
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Perpustakaan{% endblock %}</title>

    <link
        {{ bootstrap.load_css() }}
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold"
           href="{{ url_for('buku.dashboard') }}">
            <i class="bi bi-book"></i> Perpustakaan
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">
            <div class="navbar-nav ms-auto">
                <a class="nav-link"
                   href="{{ url_for('buku.dashboard') }}">
                    Daftar Buku
                </a>
                <a class="nav-link"
                   href="{{ url_for('peminjaman.halaman_peminjaman') }}">
                    Peminjaman Buku
                </a>
            </div>
        </div>
    </div>
</nav>

<main class="container py-4">
    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="alert alert-info alert-dismissible fade show">
                {{ message }}
                <button type="button" class="btn-close"
                        data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
</main>

<footer class="text-center text-secondary py-4">
    <small>&copy; 2026 Sistem Informasi Perpustakaan</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{{ bootstrap.load_js() }}
</body>
</html>
